name: Build Dev

on:
  push:
    branches: [ dev, 'develop/**', 'feature/**' ]

env:
  REGISTRY: ghcr.io
  SERVER_IMAGE: ${{ github.repository }}/node-manager-server
  AGENT_IMAGE: ${{ github.repository }}/node-agent

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Build UI
      run: |
        npm ci
        npm run build

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract server metadata
      id: server-meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.SERVER_IMAGE }}
        tags: |
          type=sha,prefix=dev-
          type=raw,value=latest-dev

    - name: Extract agent metadata
      id: agent-meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.AGENT_IMAGE }}
        tags: |
          type=sha,prefix=dev-
          type=raw,value=latest-dev

    - name: Build and push server image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./dockerfiles/node-manager/Dockerfile.server
        push: true
        tags: ${{ steps.server-meta.outputs.tags }}
        labels: ${{ steps.server-meta.outputs.labels }}

    - name: Build and push agent image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./dockerfiles/node-manager/Dockerfile.agent
        push: true
        tags: ${{ steps.agent-meta.outputs.tags }}
        labels: ${{ steps.agent-meta.outputs.labels }}
